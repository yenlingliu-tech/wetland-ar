<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>濁水溪口｜2.5D AR 穩定測試版</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #ar-container a-scene {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>

  <!-- 載入 A-Frame 和 MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <div id="ar-container">

    <a-scene
      embedded
      mindar-image="
        imageTargetSrc: ./targets.mind;
        filterMinCF: 0.0005;
        filterBeta: 0.1;
        warmupTolerance: 5;
        missTolerance: 10;
      "
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- 載入三張 PNG -->
      <a-assets timeout="30000">

        <img
          id="bg"
          src="./background-small.png">

        <img
          id="crab"
          src="./未命名的作品%20(2).png">

        <img
          id="front"
          src="./foreground.png">

      </a-assets>

      <!-- AR 相機 -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- 圖卡辨識 -->
      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">

        <!-- 第一層：背景 -->
        <a-image
          src="#bg"
          width="1.4"
          height="0.84"
          position="0 0 0.01"
          material="
            shader: flat;
            transparent: true;
            alphaTest: 0.02;
            depthWrite: false;
            side: double">
        </a-image>

        <!-- 第二層：中景 -->
        <a-image
          src="#crab"
          width="1.1"
          height="0.75"
          position="-0.12 0 0.08"
          material="
            shader: flat;
            transparent: true;
            alphaTest: 0.02;
            depthWrite: false;
            side: double"
          animation="
            property: position;
            from: -0.12 -0.015 0.08;
            to: -0.12 0.015 0.08;
            dur: 3000;
            dir: alternate;
            loop: true;
            easing: easeInOutSine">
        </a-image>

        <!-- 第三層：前景 -->
        <a-image
          src="#front"
          width="0.65"
          height="0.6"
          position="0.34 -0.23 0.22"
          material="
            shader: flat;
            transparent: true;
            alphaTest: 0.02;
            depthWrite: false;
            side: double"
          animation="
            property: position;
            from: 0.33 -0.23 0.22;
            to: 0.35 -0.23 0.22;
            dur: 4000;
            dir: alternate;
            loop: true;
            easing: easeInOutSine">
        </a-image>

      </a-entity>

    </a-scene>

  </div>

  <!-- 狀態提示 -->
  <div id="status">正在啟動 AR...</div>

  <script>
    const statusBox = document.getElementById("status");
    const target = document.getElementById("target");

    target.addEventListener("targetFound", () => {
      statusBox.textContent = "✓ 圖卡辨識成功";
    });

    target.addEventListener("targetLost", () => {
      statusBox.textContent = "請將相機對準圖卡";
    });
  </script>

</body>
</html>
