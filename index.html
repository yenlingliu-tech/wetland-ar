
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>濁水溪口｜AR 圖卡測試</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 設定 AR 全螢幕 */
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #ar-container a-scene {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <!-- AR 所需要的工具 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <div id="ar-container">

    <a-scene
      embedded
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- 手機相機 -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- 圖卡辨識 -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- 藍色測試動畫 -->
        <a-plane
          color="#00BFFF"
          width="0.8"
          height="0.5"
          position="0 0 0.1"
          animation="property: position;
                     to: 0 0.2 0.1;
                     dur: 1200;
                     dir: alternate;
                     loop: true;
                     easing: easeInOutSine">
        </a-plane>

      </a-entity>

    </a-scene>

  </div>

</body>
</html>
