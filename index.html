<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>濁水溪口｜2.5D AR 濕地場景</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #ar-container a-scene {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <div id="ar-container">

    <a-scene
      embedded
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- 載入所有圖片 -->
      <a-assets>
        <img id="background" src="./background.png">
        <img id="crab" src="./未命名的作品%20(2).png">
        <img id="foreground" src="./foreground.png">
      </a-assets>

      <!-- AR 相機 -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- 圖卡辨識 -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- 第一層：背景 -->
        <a-image
          src="#background"
          width="1.5"
          height="0.9"
          position="0 0 0.01"
          material="shader: flat; transparent: true; alphaTest: 0.01; side: double">
        </a-image>

        <!-- 第二層：招潮蟹 -->
        <a-image
          src="#crab"
          width="1.5"
          height="0.9"
          position="0 0 0.1"
          material="shader: flat; transparent: true; alphaTest: 0.01; side: double"
          animation="property: position;
                     from: 0 -0.03 0.1;
                     to: 0 0.05 0.1;
                     dur: 1500;
                     dir: alternate;
                     loop: true;
                     easing: easeInOutSine">
        </a-image>

        <!-- 第三層：前景 -->
        <a-image
          src="#foreground"
          width="1.5"
          height="0.9"
          position="0 0 0.2"
          material="shader: flat; transparent: true; alphaTest: 0.01; side: double"
          animation="property: position;
                     from: -0.02 0 0.2;
                     to: 0.02 0 0.2;
                     dur: 2200;
                     dir: alternate;
                     loop: true;
                     easing: easeInOutSine">
        </a-image>

      </a-entity>

    </a-scene>

  </div>
</body>
</html>
